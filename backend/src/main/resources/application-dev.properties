# ===================================================================
# RestaurantHub — Development Profile Configuration (dev)
# ===================================================================

# Session Cookie Configuration for Local HTTP Development
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# CORS Configuration (Local Angular dev server)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JPA / Hibernate SQL Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Development Logging Configuration
logging.level.root=INFO
logging.level.com.restauranthub=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
