# ===================================================================
# Local Development Database Configuration Example
# ===================================================================
# Instructions:
# 1. Duplicate this file as 'application-local.properties' in the 'backend/' working directory
#    (e.g., C:\Users\Admin\restaurant-hub\backend\application-local.properties).
# 2. Update the credentials below with your actual local MySQL username and password.
# 3. 'backend/application-local.properties' is gitignored and will NOT be tracked by Git
#    or packaged into runtime JAR artifacts.
# ===================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_MYSQL_USERNAME_HERE
spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE
