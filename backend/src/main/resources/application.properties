spring.application.name=restaurant-hub-backend

# Server Configuration
server.port=8080

# Database Configuration (Safe defaults with Environment Variable overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Schema validation mode: Hibernate validates entities against the database schema managed by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate allows existing non-empty development databases to adopt Flyway safely without failing
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=Initial Schema Adoption

# Disable Open EntityManager in View (OSIV) for REST APIs
spring.jpa.open-in-view=false

# Load optional local properties file if present (gitignored for security)
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# CORS Configuration (Configurable for local dev vs production client origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
