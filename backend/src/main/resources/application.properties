spring.application.name=restaurant-hub-backend

# Server Configuration
server.port=8080

# Database Configuration (Safe defaults with Environment Variable overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Development schema mode: 'update' automatically creates or updates tables without dropping data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Disable Open EntityManager in View (OSIV) for REST APIs
spring.jpa.open-in-view=false

# Load optional local properties file if present (gitignored for security)
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties
