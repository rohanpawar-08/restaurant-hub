spring.application.name=restaurant-hub-backend

# Server Configuration
server.port=${PORT:8080}

# Session Management (Defaults)
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Servlet Multipart Limits (aligns with 5 MB application upload check + multipart overhead)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=10MB

# Safe Error Handling (Never leak stack traces or internal server details)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Database Configuration (Development defaults for zero-friction local workflow)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Schema validation mode: Hibernate validates entities against the database schema managed by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable Open EntityManager in View (OSIV) for REST APIs
spring.jpa.open-in-view=false

# Load optional local properties file if present (gitignored external file for developer credential safety)
spring.config.import=optional:file:./application-local.properties

# CORS Configuration (Development default: allows Angular dev server)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Media Storage Configuration (Default: local free filesystem storage; Optional: cloudinary)
app.media.provider=${MEDIA_PROVIDER:local}
app.media.local.root=${MEDIA_LOCAL_ROOT:uploads}

# Logging Baseline
logging.level.root=INFO
logging.level.com.restauranthub=INFO
logging.level.org.springframework.security=INFO

# OpenAPI / Swagger UI Configuration (Development default: enabled under /swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
