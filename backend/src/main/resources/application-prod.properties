# ===================================================================
# RestaurantHub — Production Profile Configuration (prod)
# ===================================================================

# Server Port
server.port=${PORT:8080}

# Reverse Proxy / TLS Forwarded Headers Strategy
# Allows Spring Boot behind Nginx, Cloudflare, or AWS ALB to detect HTTPS termination
server.forward-headers-strategy=framework

# Strict HTTPS Session Cookie Configuration
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Production Database Configuration (Strict: Requires environment variables, no localhost defaults)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema Validation (Flyway remains sole schema manager)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable SQL Verbosity in Production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false

# Production CORS Configuration
# Defaults to empty string (same-origin only). If separated frontend is deployed, provide CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Production Media Storage Configuration (Configurable persistent directory or cloud provider)
app.media.provider=${MEDIA_PROVIDER:local}
app.media.local.root=${MEDIA_LOCAL_ROOT:uploads}

# Production Logging Configuration (Quiet operational logging, prevents secret leakage)
logging.level.root=WARN
logging.level.com.restauranthub=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
