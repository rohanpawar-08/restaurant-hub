<div class="not-found-page">
  <main class="not-found-container">
    <div class="not-found-card" role="status">
      <div class="error-badge">404 Error</div>
      <div class="error-icon" aria-hidden="true">🍲</div>
      <h1 class="not-found-title">Page Not Found</h1>
      <p class="not-found-desc">
        We couldn't find the page you're looking for. It might have been moved, renamed, or is temporarily unavailable.
      </p>

      <div class="not-found-actions">
        <a routerLink="/" class="btn btn-primary">
          <span>Go to Home</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </a>
        <a routerLink="/menu" class="btn btn-secondary">
          <span>Explore Menu</span>
        </a>
      </div>

      <div class="help-box">
        <p>Looking for a specific dish or craving? Check out the fresh selections at <strong>{{ restaurantName() }}</strong>.</p>
      </div>
    </div>
  </main>
</div>
