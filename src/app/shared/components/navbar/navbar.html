<nav class="navbar" aria-label="Main Navigation">

  <a routerLink="/" class="logo" aria-label="RestaurantHub Home">
    🍽 <span>RestaurantHub</span>
  </a>

  <ul class="nav-links">
    <li><a routerLink="/">Home</a></li>
    <li><a routerLink="/menu">Menu</a></li>
    <li><a routerLink="/orders">Orders</a></li>
    <li><a routerLink="/about">About</a></li>
    <li><a routerLink="/contact">Contact</a></li>
    <li>
      <a routerLink="/cart" class="cart-nav-link" aria-label="Shopping Cart">
        <span class="cart-nav-icon" aria-hidden="true">🛒</span>
        <span>Cart</span>
        @if (cartCount() > 0) {
          <span class="cart-badge" [attr.aria-label]="cartCount() + ' items in cart'">
            {{ cartCount() }}
          </span>
        }
      </a>
    </li>
  </ul>

  @if (isAuthenticated()) {
    <div class="user-nav-section">
      <span class="user-greeting" [attr.aria-label]="'Logged in as ' + currentUser()?.fullName">
        Hi, <strong>{{ userDisplayName() }}</strong>
      </span>
      <a routerLink="/profile" class="profile-btn" aria-label="Customer Profile">
        Profile
      </a>
      <button type="button" class="logout-btn" (click)="logout()" aria-label="Logout">
        Logout
      </button>
    </div>
  } @else {
    <div class="auth-buttons">
      <a routerLink="/login" class="login-btn">Login</a>
      <a routerLink="/register" class="register-btn">Register</a>
    </div>
  }

</nav>
