<div class="admin-container">
  <!-- Mobile Sidebar Backdrop Overlay -->
  @if (isSidebarOpen()) {
    <div class="sidebar-backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <!-- Sidebar -->
  <aside
    class="admin-sidebar"
    [class.is-open]="isSidebarOpen()"
    aria-label="Admin Navigation"
  >
    <div class="sidebar-header">
      <div class="sidebar-brand-row">
        <a routerLink="/admin" class="sidebar-brand" aria-label="Admin Dashboard" (click)="closeSidebar()">
          🍽 <span>{{ restaurantName() }}</span>
        </a>
        <button
          type="button"
          class="sidebar-close-btn"
          aria-label="Close sidebar"
          (click)="closeSidebar()"
        >
          ✕
        </button>
      </div>
      <span class="admin-badge">ADMIN PORTAL</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">OPERATIONS</div>
      <ul class="nav-list">
        <li>
          <a
            routerLink="/admin"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="active"
            class="nav-item"
            (click)="closeSidebar()"
          >
            <span class="nav-icon" aria-hidden="true">📊</span>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a
            routerLink="/admin/orders"
            routerLinkActive="active"
            class="nav-item"
            (click)="closeSidebar()"
          >
            <span class="nav-icon" aria-hidden="true">📦</span>
            <span>Orders</span>
          </a>
        </li>
      </ul>

      <div class="nav-section-title">CATALOG MANAGEMENT</div>
      <ul class="nav-list">
        <li>
          <a
            routerLink="/admin/menu"
            routerLinkActive="active"
            class="nav-item"
            (click)="closeSidebar()"
          >
            <span class="nav-icon" aria-hidden="true">🍔</span>
            <span>Food Menu</span>
          </a>
        </li>
        <li>
          <a
            routerLink="/admin/categories"
            routerLinkActive="active"
            class="nav-item"
            (click)="closeSidebar()"
          >
            <span class="nav-icon" aria-hidden="true">📑</span>
            <span>Categories</span>
          </a>
        </li>
      </ul>

      <div class="nav-section-title">ADMINISTRATION</div>
      <ul class="nav-list">
        <li>
          <a
            routerLink="/admin/settings"
            routerLinkActive="active"
            class="nav-item"
            (click)="closeSidebar()"
          >
            <span class="nav-icon" aria-hidden="true">⚙️</span>
            <span>Restaurant Settings</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" class="view-store-btn" (click)="closeSidebar()">
        <span aria-hidden="true">🏪</span>
        <span>View Customer Store</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="admin-main">
    <!-- Top Header -->
    <header class="admin-header">
      <div class="header-left">
        <button
          type="button"
          class="admin-menu-toggle"
          aria-label="Toggle Admin Sidebar"
          [attr.aria-expanded]="isSidebarOpen()"
          (click)="toggleSidebar()"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <span class="env-tag">Operations Console</span>
      </div>

      <div class="header-right">
        <div class="user-info">
          <span class="user-role-badge">ADMIN</span>
          <span class="user-name">{{ adminName() }}</span>
        </div>
        <button type="button" class="btn-logout" (click)="logout()" aria-label="Sign out">
          Sign Out
        </button>
      </div>
    </header>

    <!-- Subpage Content Outlet -->
    <main class="admin-content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
